[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify's "Durable" CDN tier caches function responses even when Next.js marks a route
# `dynamic = "force-dynamic"` and sends its own no-store Cache-Control — confirmed live on
# /api/download/[token] (served one purchaser's stale signed URL to every other purchaser). This
# header rule works for function-backed routes like this one; it does NOT reach pages routed
# through the Next.js runtime plugin (confirmed by testing) — those are covered in middleware.ts
# instead, which sets the same header on the real per-request response.
[[headers]]
  for = "/api/download/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
